<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Vent Engineering</title>
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
</head>
<body>
    <div class="container-narrow">
        <vent-nav></vent-nav>

        <div id="messageBox"></div>

        <div class="grid">
            <div class="panel">
                <h3>Your Account</h3>
                <p>Logged in as: <strong id="userEmail" style="word-break: break-all;">Loading...</strong></p>
                <hr>
                <form id="passwordForm">
                    <label>Update Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6 chars)" required minlength="6">
                    <button type="submit" class="btn-action">Change Password</button>
                </form>
            </div>

            <div class="panel">
                <h3>Add New Engineer</h3>
                <p>Create a new login for a team member.</p>
                <hr>
                <form id="addUserForm">
                    <label>Email Address</label>
                    <input type="email" id="newUserEmail" placeholder="engineer@vent.co.uk" required>
                    
                    <label>Temporary Password</label>
                    <input type="password" id="newUserPassword" placeholder="Minimum 6 characters" required minlength="6">
                    
                    <button type="submit" class="btn-action">Create Account</button>
                </form>
            </div>

            <div class="panel" style="grid-column: 1 / -1;">
                <h3>Database Actions</h3>
                <p>Export all support log tickets currently stored in the Firebase cloud database directly to a local CSV file on your computer.</p>
                <button id="exportBtn" class="btn-action" style="max-width: 300px;">Download Database to CSV</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, updatePassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "FIREBASE_API_KEY_PLACEHOLDER",,
            authDomain: "engineercalllog.firebaseapp.com",
            projectId: "engineercalllog",
            storageBucket: "engineercalllog.firebasestorage.app",
            messagingSenderId: "1034676535589",
            appId: "1:1034676535589:web:a3d91c5cf4de54856b9acc",
            measurementId: "G-F5LM9FBQ8Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        const messageBox = document.getElementById('messageBox');

        function showMessage(msg, isError = false) {
            messageBox.innerText = msg;
            messageBox.className = isError ? 'error-theme' : 'success-theme';
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.display = 'none'; }, 6000);
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../index.html";
            } else {
                document.getElementById('userEmail').innerText = user.email;
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Updating...";
            btn.disabled = true;

            const newPassword = document.getElementById('newPassword').value;
            const user = auth.currentUser;

            if (user) {
                try {
                    await updatePassword(user, newPassword);
                    showMessage("Password updated successfully!");
                    document.getElementById('passwordForm').reset();
                } catch (error) {
                    if(error.code === 'auth/requires-recent-login') {
                        showMessage("Security requirement: Please log out and log back in before changing your password.", true);
                    } else {
                        showMessage(error.message, true);
                    }
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }
        });

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Creating Account...";
            btn.disabled = true;

            const newUserEmail = document.getElementById('newUserEmail').value;
            const newUserPassword = document.getElementById('newUserPassword').value;

            try {
                await createUserWithEmailAndPassword(secondaryAuth, newUserEmail, newUserPassword);
                await secondaryAuth.signOut();
                
                showMessage(`Successfully created account for ${newUserEmail}. They can now log in.`);
                document.getElementById('addUserForm').reset();
            } catch (error) {
                console.error("Error creating user:", error);
                if (error.code === 'auth/email-already-in-use') {
                    showMessage("An account with this email address already exists.", true);
                } else {
                    showMessage("Failed to create user: " + error.message, true);
                }
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const btn = document.getElementById('exportBtn');
            btn.innerText = "Generating CSV...";
            btn.disabled = true;

            try {
                const q = query(collection(db, "tickets"), orderBy("ticketId", "asc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    showMessage("Database is empty. No tickets to export.", true);
                    btn.innerText = "Download Database to CSV";
                    btn.disabled = false;
                    return;
                }

                // CSV Headers updated with Project Number
                const headers = [
                    "Ticket Number", "Date", "Time", "Engineer", "Project Number", "Contact Via", "System", 
                    "Origin of Query / Fault", "Reported Issue", "Cause", "Solution", "Status"
                ];

                const escapeCSV = (str) => {
                    if (str == null) return '""';
                    return `"${String(str).replace(/"/g, '""')}"`;
                };

                let csvContent = headers.map(escapeCSV).join(",") + "\n";

                querySnapshot.forEach((doc) => {
                    const t = doc.data();
                    // Map the data fields directly matching the new headers array
                    const row = [
                        t.ticketNumber, t.Date, t.Time, t.Engineer, t.Project_Number, t.Contact_Via, t.System,
                        t.Origin_Of_Fault, t.Reported_Issue, t.Cause, t.Solution, t.Status
                    ];
                    csvContent += row.map(escapeCSV).join(",") + "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `vent_support_log_${new Date().toISOString().split('T')[0]}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showMessage("Database exported to CSV successfully!");
            } catch (error) {
                console.error("Error exporting to CSV: ", error);
                showMessage("Failed to export database. Check console.", true);
            } finally {
                btn.innerText = "Download Database to CSV";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
