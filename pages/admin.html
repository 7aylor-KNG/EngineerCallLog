<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Vent Engineering</title>
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
</head>
<body>
    <div class="container-narrow">
        <vent-nav></vent-nav>

        <div id="messageBox"></div>

        <div class="grid">
            <div class="panel">
                <h3>Your Account</h3>
                <p>Logged in as: <strong id="userEmail" style="word-break: break-all;">Loading...</strong></p>
                <hr>
                <form id="passwordForm">
                    <label>Update Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6 chars)" required minlength="6">
                    <button type="submit" class="btn-action">Change Password</button>
                </form>
            </div>

            <div class="panel">
                <h3>Add New Engineer</h3>
                <p>Create a new login for a team member.</p>
                <hr>
                <form id="addUserForm">
                    <label>Email Address</label>
                    <input type="email" id="newUserEmail" placeholder="engineer@vent.co.uk" required>
                    
                    <label>Temporary Password</label>
                    <input type="password" id="newUserPassword" placeholder="Minimum 6 characters" required minlength="6">
                    
                    <button type="submit" class="btn-action">Create Account</button>
                </form>
            </div>

            <div class="panel" style="grid-column: 1 / -1;">
                <h3>Database Actions</h3>
                <p>Export your cloud databases directly to local CSV files on your computer.</p>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;">
                    <button id="exportTicketsBtn" class="btn-action" style="margin-top: 0;">Download Support Tickets</button>
                    <button id="exportLoginCodesBtn" class="btn-action" style="margin-top: 0; background: #333;">Download Login Codes</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, updatePassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCP85SLMa90kxu0lJVLL0qFUWgHZvZsAOM",
            authDomain: "engineercalllog.firebaseapp.com",
            projectId: "engineercalllog",
            storageBucket: "engineercalllog.firebasestorage.app",
            messagingSenderId: "1034676535589",
            appId: "1:1034676535589:web:a3d91c5cf4de54856b9acc",
            measurementId: "G-F5LM9FBQ8Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        const messageBox = document.getElementById('messageBox');

        function showMessage(msg, isError = false) {
            messageBox.innerText = msg;
            messageBox.className = isError ? 'error-theme' : 'success-theme';
            messageBox.style.display = 'block';
            setTimeout(() => { messageBox.style.display = 'none'; }, 6000);
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "../index.html";
            else document.getElementById('userEmail').innerText = user.email;
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Updating...";
            btn.disabled = true;
            const newPassword = document.getElementById('newPassword').value;
            try {
                await updatePassword(auth.currentUser, newPassword);
                showMessage("Password updated successfully!");
                document.getElementById('passwordForm').reset();
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Creating...";
            btn.disabled = true;
            const newUserEmail = document.getElementById('newUserEmail').value;
            const newUserPassword = document.getElementById('newUserPassword').value;
            try {
                await createUserWithEmailAndPassword(secondaryAuth, newUserEmail, newUserPassword);
                await secondaryAuth.signOut();
                showMessage(`Successfully created account for ${newUserEmail}.`);
                document.getElementById('addUserForm').reset();
            } catch (error) {
                showMessage("Failed to create user: " + error.message, true);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // 1. Export Support Tickets
        document.getElementById('exportTicketsBtn').addEventListener('click', async () => {
            const btn = document.getElementById('exportTicketsBtn');
            btn.innerText = "Generating CSV...";
            btn.disabled = true;

            try {
                const q = query(collection(db, "tickets"), orderBy("ticketId", "asc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    showMessage("No support tickets to export.", true);
                    btn.innerText = "Download Support Tickets";
                    btn.disabled = false;
                    return;
                }

                const headers = ["Ticket Number", "Date", "Time", "Engineer", "Project Number", "Contact Via", "System", "Origin of Query / Fault", "Reported Issue", "Cause", "Solution", "Status"];
                const escapeCSV = (str) => str == null ? '""' : `"${String(str).replace(/"/g, '""')}"`;
                let csvContent = headers.map(escapeCSV).join(",") + "\n";

                querySnapshot.forEach((doc) => {
                    const t = doc.data();
                    const row = [t.ticketNumber, t.Date, t.Time, t.Engineer, t.Project_Number, t.Contact_Via, t.System, t.Origin_Of_Fault, t.Reported_Issue, t.Cause, t.Solution, t.Status];
                    csvContent += row.map(escapeCSV).join(",") + "\n";
                });

                downloadCSV(csvContent, `vent_support_log_${new Date().toISOString().split('T')[0]}.csv`);
                showMessage("Tickets exported successfully!");
            } catch (error) {
                showMessage("Failed to export tickets.", true);
            } finally {
                btn.innerText = "Download Support Tickets";
                btn.disabled = false;
            }
        });

        // 2. Export Login Codes
        document.getElementById('exportLoginCodesBtn').addEventListener('click', async () => {
            const btn = document.getElementById('exportLoginCodesBtn');
            btn.innerText = "Generating CSV...";
            btn.disabled = true;

            try {
                const q = query(collection(db, "login_codes"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    showMessage("No login codes to export.", true);
                    btn.innerText = "Download Login Codes";
                    btn.disabled = false;
                    return;
                }

                const headers = ["Date", "Time", "Sales No.", "Project Name", "Software Version", "Name", "Phone No.", "Company", "Postcode"];
                const escapeCSV = (str) => str == null ? '""' : `"${String(str).replace(/"/g, '""')}"`;
                let csvContent = headers.map(escapeCSV).join(",") + "\n";

                querySnapshot.forEach((doc) => {
                    const t = doc.data();
                    const row = [t.Date, t.Time, t.Sales_No, t.Project_Name, t.Software_Version, t.Name, t.Phone_No, t.Company, t.Postcode];
                    csvContent += row.map(escapeCSV).join(",") + "\n";
                });

                downloadCSV(csvContent, `vent_login_codes_${new Date().toISOString().split('T')[0]}.csv`);
                showMessage("Login Codes exported successfully!");
            } catch (error) {
                showMessage("Failed to export login codes.", true);
            } finally {
                btn.innerText = "Download Login Codes";
                btn.disabled = false;
            }
        });

        function downloadCSV(csvContent, filename) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
