<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log a Ticket - Vent Engineering</title>
    <link rel="stylesheet" href="style.css">
    <script src="nav.js"></script>
</head>
<body>
    <div class="container-narrow">
        <vent-nav></vent-nav>

        <div id="successBanner">Ticket Logged Successfully!</div>

        <div class="form-container">
            <h2>Controls Engineer Support Log</h2>
            <form id="ticketForm" class="grid-15">
                
                <div>
                    <label>Date</label>
                    <input type="date" id="Date" required>
                </div>
                
                <div>
                    <label>Time</label>
                    <input type="time" id="Time" required>
                </div>
                
                <div>
                    <label>Engineer</label>
                    <input type="text" id="Engineer" required>
                </div>
                
                <div>
                    <label>Project Number</label>
                    <input type="text" id="Project_Number" pattern="^6.*" title="Must start with a 6" placeholder="e.g. 60123" required>
                </div>
                
                <div>
                    <label>Contact Via</label>
                    <select id="Contact_Via">
                        <option value="Phone">Phone</option>
                        <option value="Aircall">Aircall</option>
                        <option value="Facetime">Facetime</option>
                        <option value="Email">Email</option>
                        <option value="SMS">SMS</option>
                        <option value="Office">Office</option>
                    </select>
                </div>
                
                <div>
                    <label>System</label>
                    <select id="System">
                        <option value="O Range">O Range</option>
                        <option value="1000 Series">1000 Series</option>
                        <option value="2000 Series">2000 Series</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="System_Other" placeholder="Please specify..." style="display: none; margin-top: 10px;">
                </div>
                
                <div class="full">
                    <label>Origin of Query / Fault</label>
                    <select id="Origin_Of_Fault">
                        <option value="Controls">Controls</option>
                        <option value="Manufacturer">Manufacturer</option>
                        <option value="Design">Design</option>
                        <option value="Production">Production</option>
                        <option value="Site">Site</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="full">
                    <label>Reported Issue / Query</label>
                    <textarea id="Reported_Issue" rows="3" required></textarea>
                </div>
                
                <div class="full">
                    <label>Cause</label>
                    <textarea id="Cause" rows="2"></textarea>
                </div>
                
                <div class="full">
                    <label>Solution</label>
                    <textarea id="Solution" rows="2"></textarea>
                </div>
                
                <div class="full">
                    <label>Status</label>
                    <select id="Status">
                        <option value="Open">Open</option>
                        <option value="Closed / Resolved">Closed / Resolved</option>
                        <option value="Awaiting Parts">Awaiting Parts</option>
                        <option value="Requires Site Visit">Requires Site Visit</option>
                    </select>
                </div>

                <div class="full" style="background: #f9f9f9; padding: 15px; border: 1px dashed #ccc; border-radius: 4px;">
                    <label style="margin-bottom: 5px; display: block; font-weight: bold;">Attach Photos (Optional, Max 3)</label>
                    <p style="font-size: 0.85em; margin-top: 0; color: #666;">Attach screenshots of the panel, TeamViewer, or fault code. The system will auto-compress them.</p>
                    <input type="file" id="ticketPhoto" accept="image/*" multiple>
                    <p id="fileWarning" style="color: #dc3545; font-size: 0.85em; display: none; margin-top: 5px; font-weight: bold;">Maximum of 3 photos allowed. Please select fewer files.</p>
                </div>

                <div class="full">
                    <button type="submit" id="submitBtn" style="margin-top: 10px;">Submit Ticket</button>
                </div>
                
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Your specific EngineerCallLog configuration
        const firebaseConfig = {
            apiKey: "FIREBASE_API_KEY_PLACEHOLDER",
            authDomain: "engineercalllog.firebaseapp.com",
            projectId: "engineercalllog",
            storageBucket: "engineercalllog.firebasestorage.app",
            messagingSenderId: "1034676535589",
            appId: "1:1034676535589:web:a3d91c5cf4de54856b9acc",
            measurementId: "G-F5LM9FBQ8Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const setDateTime = () => {
            const now = new Date();
            document.getElementById('Date').valueAsDate = now;
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('Time').value = `${hours}:${minutes}`;
        };
        setDateTime();

        const systemSelect = document.getElementById('System');
        const systemOtherInput = document.getElementById('System_Other');
        
        systemSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Other') {
                systemOtherInput.style.display = 'block';
                systemOtherInput.required = true;
            } else {
                systemOtherInput.style.display = 'none';
                systemOtherInput.required = false;
                systemOtherInput.value = ''; 
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../index.html";
            }
        });

        document.addEventListener('click', (e) => {
            if(e.target && e.target.id === 'logoutBtn') {
                signOut(auth).then(() => {
                    window.location.href = "../index.html";
                });
            }
        });

        // Client-side Image Auto-Compressor
        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200; 
                        const MAX_HEIGHT = 1200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Compress to JPEG at 60% quality
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        resolve(dataUrl);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        };

        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalText = "Submit Ticket";
            
            // Handle Multiple Photo Compressions first
            const photoInput = document.getElementById('ticketPhoto');
            let base64Photos = []; 
            
            // Enforce a maximum of 3 files
            if (photoInput.files.length > 3) {
                document.getElementById('fileWarning').style.display = 'block';
                return; // Stop the submission completely
            } else {
                document.getElementById('fileWarning').style.display = 'none';
            }

            submitBtn.innerText = "Processing Data...";
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = '#666'; 

            try {
                let newTicketId = 1001;
                const q = query(collection(db, "tickets"), orderBy("ticketId", "desc"), limit(1));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    newTicketId = querySnapshot.docs[0].data().ticketId + 1;
                }

                let finalSystem = document.getElementById('System').value;
                if (finalSystem === 'Other') {
                    finalSystem = "Other: " + document.getElementById('System_Other').value;
                }
                
                if (photoInput.files.length > 0) {
                    submitBtn.innerText = `Compressing ${photoInput.files.length} Photo(s)...`;
                    for (let i = 0; i < photoInput.files.length; i++) {
                         const compressedString = await compressImage(photoInput.files[i]);
                         base64Photos.push(compressedString);
                    }
                }

                submitBtn.innerText = "Saving to Database...";

                // Gather data including the new imageUrls array
                const ticketData = {
                    ticketId: newTicketId,
                    ticketNumber: `TKT-${newTicketId}`,
                    Date: document.getElementById('Date').value,
                    Time: document.getElementById('Time').value,
                    Engineer: document.getElementById('Engineer').value,
                    Project_Number: document.getElementById('Project_Number').value,
                    Contact_Via: document.getElementById('Contact_Via').value,
                    System: finalSystem,
                    Origin_Of_Fault: document.getElementById('Origin_Of_Fault').value,
                    Reported_Issue: document.getElementById('Reported_Issue').value,
                    Cause: document.getElementById('Cause').value,
                    Solution: document.getElementById('Solution').value,
                    Status: document.getElementById('Status').value,
                    imageUrls: base64Photos, // Now storing an array of strings
                    timestamp: new Date().toISOString(),
                    createdBy: auth.currentUser.email,
                    lastUpdatedBy: auth.currentUser.email 
                };

                await addDoc(collection(db, "tickets"), ticketData);

                submitBtn.style.backgroundColor = '#28a745'; 
                submitBtn.innerText = `Saved! (TKT-${newTicketId})`;
                
                const banner = document.getElementById('successBanner');
                banner.innerText = `Ticket TKT-${newTicketId} Logged Successfully!`;
                banner.style.display = 'block';
                banner.className = 'success-theme';
                
                document.getElementById('ticketForm').reset();
                setDateTime(); 
                systemOtherInput.style.display = 'none'; 
                
                setTimeout(() => { 
                    banner.style.display = 'none'; 
                    submitBtn.style.backgroundColor = ''; 
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }, 3000);

            } catch (error) {
                console.error("Error adding document: ", error);
                
                submitBtn.style.backgroundColor = '#dc3545';
                submitBtn.innerText = "Error Saving Ticket";
                
                setTimeout(() => {
                    submitBtn.style.backgroundColor = ''; 
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }, 4000);
            }
        });
    </script>
</body>
</html>
