<!DOCTYPE html>
<html lang="en">
<head>
    <script src="nav.js"></script>
</head>
<body>
    <vent-nav></vent-nav>
        <div id="successBanner">Ticket Logged Successfully!</div>

        <div class="form-container">
            <h2>Controls Engineer Support Log</h2>
            <form id="ticketForm" class="grid">
                <div>
                    <label>Date</label>
                    <input type="date" id="Date" required>
                </div>
                <div>
                    <label>Time</label>
                    <input type="time" id="Time" required>
                </div>
                <div>
                    <label>Engineer</label>
                    <input type="text" id="Engineer" required>
                </div>
                <div>
                    <label>Contact Via</label>
                    <select id="Contact_Via">
                        <option value="Phone">Phone</option>
                        <option value="Aircall">Aircall</option>
                        <option value="Facetime">Facetime</option>
                        <option value="Email">Email</option>
                        <option value="SMS">SMS</option>
                        <option value="Office">Office</option>
                    </select>
                </div>
                <div>
                    <label>System</label>
                    <select id="System">
                        <option value="O Range">O Range</option>
                        <option value="1000 Series">1000 Series</option>
                        <option value="2000 Series">2000 Series</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="System_Other" placeholder="Please specify..." style="display: none; margin-top: 10px;">
                </div>
                <div>
                    <label>Origin of Fault</label>
                    <select id="Origin_Of_Fault">
                        <option value="Controls">Controls</option>
                        <option value="Manufacturer">Manufacturer</option>
                        <option value="Design">Design</option>
                        <option value="Production">Production</option>
                        <option value="Site">Site</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="full">
                    <label>Reported Issue</label>
                    <textarea id="Reported_Issue" rows="3" required></textarea>
                </div>
                <div class="full">
                    <label>Cause</label>
                    <textarea id="Cause" rows="2"></textarea>
                </div>
                <div class="full">
                    <label>Solution</label>
                    <textarea id="Solution" rows="2"></textarea>
                </div>
                <div class="full">
                    <label>Status</label>
                    <select id="Status">
                        <option value="Open">Open</option>
                        <option value="Closed / Resolved">Closed / Resolved</option>
                        <option value="Awaiting Parts">Awaiting Parts</option>
                        <option value="Requires Site Visit">Requires Site Visit</option>
                    </select>
                </div>

                <div class="full">
                    <button type="submit" id="submitBtn">Submit Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCP85SLMa90kxu0lJVLL0qFUWgHZvZsAOM",
            authDomain: "engineercalllog.firebaseapp.com",
            projectId: "engineercalllog",
            storageBucket: "engineercalllog.firebasestorage.app",
            messagingSenderId: "1034676535589",
            appId: "1:1034676535589:web:a3d91c5cf4de54856b9acc",
            measurementId: "G-F5LM9FBQ8Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Auto-fill today's date and current time
        const setDateTime = () => {
            const now = new Date();
            document.getElementById('Date').valueAsDate = now;
            // Format time to HH:MM for the input field
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('Time').value = `${hours}:${minutes}`;
        };
        setDateTime();

        // Show/Hide the "Other" System text box dynamically
        const systemSelect = document.getElementById('System');
        const systemOtherInput = document.getElementById('System_Other');
        
        systemSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Other') {
                systemOtherInput.style.display = 'block';
                systemOtherInput.required = true;
            } else {
                systemOtherInput.style.display = 'none';
                systemOtherInput.required = false;
                systemOtherInput.value = ''; // clear it out
            }
        });

        // 1. Authentication Check
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../index.html";
            }
        });

        // 2. Logout Handler
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "../index.html";
            });
        });

        // 3. Form Submission
        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalText = "Submit Ticket";
            
            // Immediate visual feedback that processing has started
            submitBtn.innerText = "Saving to Database...";
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = '#666'; // Gray out while saving

            try {
                // Determine the next ticket number
                let newTicketId = 1001;
                const q = query(collection(db, "tickets"), orderBy("ticketId", "desc"), limit(1));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    newTicketId = querySnapshot.docs[0].data().ticketId + 1;
                }

                // Handle the 'Other' logic for System before saving
                let finalSystem = document.getElementById('System').value;
                if (finalSystem === 'Other') {
                    finalSystem = "Other: " + document.getElementById('System_Other').value;
                }

                // Gather data
                const ticketData = {
                    ticketId: newTicketId,
                    ticketNumber: `TKT-${newTicketId}`,
                    Date: document.getElementById('Date').value,
                    Time: document.getElementById('Time').value,
                    Engineer: document.getElementById('Engineer').value,
                    Contact_Via: document.getElementById('Contact_Via').value,
                    System: finalSystem,
                    Origin_Of_Fault: document.getElementById('Origin_Of_Fault').value,
                    Reported_Issue: document.getElementById('Reported_Issue').value,
                    Cause: document.getElementById('Cause').value,
                    Solution: document.getElementById('Solution').value,
                    Status: document.getElementById('Status').value,
                    timestamp: new Date().toISOString()
                };

                // Push to Firestore
                await addDoc(collection(db, "tickets"), ticketData);

                // SUCCESS: Change button to Green
                submitBtn.style.backgroundColor = '#28a745'; 
                submitBtn.innerText = `Saved! (TKT-${newTicketId})`;
                
                // Show success banner 
                const banner = document.getElementById('successBanner');
                banner.innerText = `Ticket TKT-${newTicketId} Logged Successfully!`;
                banner.style.display = 'block';
                
                // Reset form
                document.getElementById('ticketForm').reset();
                setDateTime(); // reset date and time to now
                systemOtherInput.style.display = 'none'; // hide the other box again
                
                // Reset button and banner after 3 seconds
                setTimeout(() => { 
                    banner.style.display = 'none'; 
                    submitBtn.style.backgroundColor = '#000'; // Back to standard black
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }, 3000);

            } catch (error) {
                console.error("Error adding document: ", error);
                
                // FAILURE: Change button to Red
                submitBtn.style.backgroundColor = '#dc3545';
                submitBtn.innerText = "Error Saving Ticket";
                
                // Reset button after 4 seconds so they can try again
                setTimeout(() => {
                    submitBtn.style.backgroundColor = '#000'; // Back to standard black
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }, 4000);
            }
        });
    </script>
</body>
</html>
