<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket History - Vent Engineering</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../nav.js"></script>
</head>
<body>
    <div class="container">
        <vent-nav></vent-nav>

        <h2 style="margin-top: 0;">Ticket History</h2>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Filter loaded tickets by Number, Engineer, Project No, or Issue...">
            <select id="statusFilter">
                <option value="All">All Statuses</option>
                <option value="Open">Open</option>
                <option value="Closed / Resolved">Closed / Resolved</option>
                <option value="Awaiting Parts">Awaiting Parts</option>
                <option value="Requires Site Visit">Requires Site Visit</option>
            </select>
        </div>

        <div class="table-container">
            <table id="ticketTable">
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Date & Time</th>
                        <th>Engineer</th>
                        <th>Project No.</th>
                        <th>System</th>
                        <th>Issue</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align: center;">Loading tickets...</td></tr>
                </tbody>
            </table>
        </div>

        <button id="loadMoreBtn" class="btn-action">Load Older Tickets</button>
    </div>

    <div class="modal-overlay" id="ticketModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle" style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;">Ticket Details</h2>
            
            <form id="updateForm">
                <input type="hidden" id="modalDocId">

                <div class="grid-2">
                    <div>
                        <label>Engineer</label>
                        <input type="text" id="modalEngineer" required style="border-color: #000;">
                    </div>
                    <div>
                        <label>Project Number</label>
                        <input type="text" id="modalProject" style="border-color: #000;">
                    </div>
                    <div>
                        <label>System</label>
                        <input type="text" id="modalSystem" required style="border-color: #000;">
                    </div>
                    <div>
                        <label>Contact Via</label>
                        <input type="text" id="modalContact" required style="border-color: #000;">
                    </div>
                    <div style="grid-column: span 2;">
                        <label>Origin of Query / Fault</label>
                        <input type="text" id="modalOrigin" required style="border-color: #000;">
                    </div>
                </div>

                <label>Reported Issue</label>
                <textarea id="modalIssue" rows="3" required style="border-color: #000;"></textarea>

                <label>Update Status</label>
                <select id="modalStatus" style="border-color: #000; font-weight: bold;">
                    <option value="Open">Open</option>
                    <option value="Closed / Resolved">Closed / Resolved</option>
                    <option value="Awaiting Parts">Awaiting Parts</option>
                    <option value="Requires Site Visit">Requires Site Visit</option>
                </select>

                <label>Cause</label>
                <textarea id="modalCause" rows="2" style="border-color: #000;"></textarea>

                <label>Solution</label>
                <textarea id="modalSolution" rows="2" style="border-color: #000;"></textarea>

                <button type="submit" class="btn-action" style="width: 100%; margin-top: 20px;" id="btnUpdate">Save Updates</button>
                
                <p id="modalAuditLog" style="margin-top: 15px; font-size: 0.8em; color: #888; text-align: right;"></p>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy, limit, startAfter } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // IMPORTANT: Ensure these match the specific database from your screenshot!
        const firebaseConfig = {
            apiKey: "FIREBASE_API_KEY_PLACEHOLDER",
            authDomain: "engineercalllog.firebaseapp.com",
            projectId: "engineercalllog",
            storageBucket: "engineercalllog.firebasestorage.app",
            messagingSenderId: "1034676535589",
            appId: "1:1034676535589:web:a3d91c5cf4de54856b9acc",
            measurementId: "G-F5LM9FBQ8Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allTickets = [];
        let lastVisibleDoc = null;
        const TICKETS_PER_PAGE = 50;

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "../index.html";
            else fetchTickets(false); 
        });

        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            fetchTickets(true); 
        });

        async function fetchTickets(isLoadMore) {
            const loadBtn = document.getElementById('loadMoreBtn');
            
            if (isLoadMore) {
                loadBtn.innerText = "Loading...";
                loadBtn.disabled = true;
            }

            try {
                let q;
                if (isLoadMore && lastVisibleDoc) {
                    q = query(collection(db, "tickets"), orderBy("ticketId", "desc"), startAfter(lastVisibleDoc), limit(TICKETS_PER_PAGE));
                } else {
                    q = query(collection(db, "tickets"), orderBy("ticketId", "desc"), limit(TICKETS_PER_PAGE));
                    allTickets = []; 
                }

                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1];
                    
                    querySnapshot.forEach((doc) => {
                        allTickets.push({ docId: doc.id, ...doc.data() });
                    });

                    if (querySnapshot.docs.length < TICKETS_PER_PAGE) {
                        loadBtn.style.display = 'none';
                    } else {
                        loadBtn.style.display = 'block';
                        loadBtn.innerText = "Load Older Tickets";
                        loadBtn.disabled = false;
                    }
                } else {
                    loadBtn.style.display = 'none';
                }
                
                renderTable();
            } catch (error) {
                console.error("Error fetching tickets:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="color:red; text-align:center;">Error loading data. Check console.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('statusFilter').value;

            tbody.innerHTML = ''; 

            const filteredTickets = allTickets.filter(t => {
                const matchesSearch = 
                    (t.ticketNumber && t.ticketNumber.toLowerCase().includes(searchTerm)) ||
                    (t.Engineer && t.Engineer.toLowerCase().includes(searchTerm)) ||
                    (t.Project_Number && t.Project_Number.toLowerCase().includes(searchTerm)) ||
                    (t.Reported_Issue && t.Reported_Issue.toLowerCase().includes(searchTerm));
                
                const matchesStatus = filterStatus === 'All' || t.Status === filterStatus;
                
                return matchesSearch && matchesStatus;
            });

            if (filteredTickets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px;">No matching tickets found.</td></tr>';
                return;
            }

            filteredTickets.forEach(t => {
                let badgeClass = 'bg-open';
                if (t.Status === 'Closed / Resolved') badgeClass = 'bg-closed';
                else if (t.Status === 'Awaiting Parts') badgeClass = 'bg-waiting';
                else if (t.Status === 'Requires Site Visit') badgeClass = 'bg-site';

                let shortIssue = t.Reported_Issue || '';
                if (shortIssue.length > 45) shortIssue = shortIssue.substring(0, 45) + '...';

                let dateTimeDisplay = t.Date || 'N/A';
                if (t.Time) dateTimeDisplay += ` <br><span style="font-size:0.85em; color:#666;">${t.Time}</span>`;

                const tr = document.createElement('tr');
                tr.onclick = () => openModal(t.docId);
                
                tr.innerHTML = `
                    <td><strong>${t.ticketNumber || 'N/A'}</strong></td>
                    <td>${dateTimeDisplay}</td>
                    <td>${t.Engineer || 'N/A'}</td>
                    <td>${t.Project_Number || 'N/A'}</td>
                    <td>${t.System || 'N/A'}</td>
                    <td>${shortIssue}</td>
                    <td><span class="badge ${badgeClass}">${t.Status || 'Unknown'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('searchInput').addEventListener('input', renderTable);
        document.getElementById('statusFilter').addEventListener('change', renderTable);

        const modal = document.getElementById('ticketModal');
        
        function openModal(docId) {
            const ticket = allTickets.find(t => t.docId === docId);
            if (!ticket) return;

            document.getElementById('modalTitle').innerText = `Update ${ticket.ticketNumber}`;
            document.getElementById('modalDocId').value = docId;
            document.getElementById('modalEngineer').value = ticket.Engineer || '';
            document.getElementById('modalProject').value = ticket.Project_Number || '';
            document.getElementById('modalSystem').value = ticket.System || '';
            document.getElementById('modalContact').value = ticket.Contact_Via || '';
            document.getElementById('modalOrigin').value = ticket.Origin_Of_Fault || '';
            document.getElementById('modalIssue').value = ticket.Reported_Issue || '';
            
            document.getElementById('modalStatus').value = ticket.Status || 'Open';
            document.getElementById('modalCause').value = ticket.Cause || '';
            document.getElementById('modalSolution').value = ticket.Solution || '';

            const creator = ticket.createdBy || 'Legacy User';
            const updater = ticket.lastUpdatedBy || ticket.createdBy || 'Legacy User';
            document.getElementById('modalAuditLog').innerText = `Created by: ${creator} | Last updated by: ${updater}`;

            modal.style.display = 'flex';
        }

        document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
        window.onclick = (event) => { if (event.target == modal) modal.style.display = 'none'; }

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnUpdate');
            
            // Gather ALL values from the newly unlocked inputs
            const docId = document.getElementById('modalDocId').value;
            const newEngineer = document.getElementById('modalEngineer').value;
            const newProject = document.getElementById('modalProject').value;
            const newSystem = document.getElementById('modalSystem').value;
            const newContact = document.getElementById('modalContact').value;
            const newOrigin = document.getElementById('modalOrigin').value;
            const newIssue = document.getElementById('modalIssue').value;
            const newStatus = document.getElementById('modalStatus').value;
            const newCause = document.getElementById('modalCause').value;
            const newSolution = document.getElementById('modalSolution').value;

            btn.innerText = "Updating Database...";
            btn.disabled = true;

            try {
                const ticketRef = doc(db, "tickets", docId);
                
                // Push ALL updated values to Firebase
                await updateDoc(ticketRef, {
                    Engineer: newEngineer,
                    Project_Number: newProject,
                    System: newSystem,
                    Contact_Via: newContact,
                    Origin_Of_Fault: newOrigin,
                    Reported_Issue: newIssue,
                    Status: newStatus,
                    Cause: newCause,
                    Solution: newSolution,
                    lastUpdatedBy: auth.currentUser.email,
                    lastUpdatedTimestamp: new Date().toISOString()
                });

                // Update the local table array immediately
                const index = allTickets.findIndex(t => t.docId === docId);
                if (index !== -1) {
                    allTickets[index].Engineer = newEngineer;
                    allTickets[index].Project_Number = newProject;
                    allTickets[index].System = newSystem;
                    allTickets[index].Contact_Via = newContact;
                    allTickets[index].Origin_Of_Fault = newOrigin;
                    allTickets[index].Reported_Issue = newIssue;
                    allTickets[index].Status = newStatus;
                    allTickets[index].Cause = newCause;
                    allTickets[index].Solution = newSolution;
                    allTickets[index].lastUpdatedBy = auth.currentUser.email;
                }

                renderTable();
                modal.style.display = 'none'; 
                
            } catch (error) {
                console.error("Error updating document: ", error);
                alert("Error updating ticket. Check console.");
            } finally {
                btn.innerText = "Save Updates";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
