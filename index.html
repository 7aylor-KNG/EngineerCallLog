<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internal Technical Support Portal</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-container { 
            background: #fff; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
            border: 1px solid #000; 
        }
        .company-logo {
            max-width: 180px; 
            height: auto;
            margin-bottom: 20px;
        }
        h2 { 
            color: #000; 
            margin-bottom: 30px; 
            margin-top: 0;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #000; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        button { 
            width: 100%; 
            background-color: #000; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        button:hover { 
            background-color: #333; 
        }
        #errorMessage { 
            color: #dc3545; 
            margin-top: 15px; 
            font-size: 14px; 
            display: none; 
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="assets/logo.png" alt="Vent Engineering Logo" class="company-logo">
        
        <h2>Internal Technical Support Portal</h2>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div id="errorMessage"></div>
    </div>

    <script type="module">
        // Import Firebase SDKs from CDN for static HTML hosting
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "FIREBASE_API_KEY_PLACEHOLDER",
            authDomain: "engineercalllog.firebaseapp.com",
            projectId: "engineercalllog",
            storageBucket: "engineercalllog.firebasestorage.app",
            messagingSenderId: "1034676535589",
            appId: "1:1034676535589:web:a3d91c5cf4de54856b9acc",
            measurementId: "G-F5LM9FBQ8Q"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);

        // Handle Login Submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.style.display = 'none';

            // Sign in with email and password
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Redirect to the dashboard inside the pages folder
                    window.location.href = "pages/dashboard.html";
                })
                .catch((error) => {
                    // Failed to sign in
                    errorDiv.innerText = "Authentication failed. Please check your credentials.";
                    errorDiv.style.display = 'block';
                    console.error("Login Error:", error.message);
                });
        });
    </script>
</body>
</html>
